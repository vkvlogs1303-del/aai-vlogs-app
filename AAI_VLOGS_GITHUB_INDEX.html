<script>
const input=document.getElementById('input');
const output=document.getElementById('name');
function formatName(s){
 const words=s.trim().split(/\s+/).filter(Boolean);
 if(!words.length)return '';
 const lines=[''];
 for(const word of words){
   const i=lines.length-1;
   const test=lines[i]?lines[i]+' '+word:word;
   if(test.length>18 && lines[i]) lines.push(word); else lines[i]=test;
 }
 return lines.slice(0,2).join('\n');
}
function writeName(){
 const text=formatName(input.value); output.textContent='';
 if(!text)return;
 let i=0; const speed=Math.max(38,Math.min(85,900/text.length));
 const timer=setInterval(()=>{output.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(timer)},speed);
}
document.getElementById('write').onclick=writeName;
document.getElementById('clear').onclick=()=>{input.value='';output.textContent='';document.getElementById('commentText').textContent='';input.focus();};
input.addEventListener('keydown',e=>{if(e.key==='Enter')writeName();});

let pollTimer=null,lastSeen=new Set(),demoTimer=null;

function showIncomingName(name,message=''){
  if(!name) return;
  input.value=name;
  writeName();
  document.getElementById('commentText').textContent=message ? '💬 ' + message : '';
}

async function pollYouTube(){
  const key=document.getElementById('apiKey').value.trim();
  const chatId=document.getElementById('liveChatId').value.trim();
  if(!key || !chatId) return;
  try{
    const url='https://www.googleapis.com/youtube/v3/liveChat/messages?part=snippet,authorDetails&liveChatId='+
      encodeURIComponent(chatId)+'&maxResults=20&key='+encodeURIComponent(key);
    const res=await fetch(url);
    const data=await res.json();
    if(data.error) throw new Error(data.error.message || 'API error');
    const items=(data.items||[]).reverse();
    for(const item of items){
      if(lastSeen.has(item.id)) continue;
      lastSeen.add(item.id);
      const name=item.authorDetails?.displayName;
      const message=item.snippet?.displayMessage || '';
      if(name) showIncomingName(name,message);
    }
    document.getElementById('liveStatus').textContent='● LIVE CONNECTED';
  }catch(e){
    document.getElementById('liveStatus').textContent='● Connection error: '+e.message;
  }
}

document.getElementById('connectBtn').onclick=()=>{
  clearInterval(demoTimer); lastSeen.clear(); pollYouTube();
  clearInterval(pollTimer); pollTimer=setInterval(pollYouTube,5000);
  document.getElementById('liveStatus').textContent='● Connecting...';
};

document.getElementById('demoBtn').onclick=()=>{
  clearInterval(pollTimer);
  const names=['AAI VLOGS','Rahul','Aamir','Sana','Rohit','Priya'];
  let n=0; clearInterval(demoTimer);
  const messages=['Hello bhai! ❤️','Nice live! 🔥','Love from India 🇮🇳','Keep going boss! 😄','Amazing stream!','Hello everyone 👋'];
  demoTimer=setInterval(()=>{const k=n++%names.length;showIncomingName(names[k],messages[k]);},3500);
  showIncomingName(names[0],messages[0]);
  document.getElementById('liveStatus').textContent='● DEMO MODE';
};

</script>

function waitForGoogleSignIn(timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    const started=Date.now();
    const check=()=>{
      if(window.google && google.accounts && google.accounts.oauth2) return resolve();
      if(Date.now()-started>=timeoutMs) return reject(new Error('Google Sign-In load nahi hua. Agar app ke andar page file:// se chal raha hai, HTTPS Netlify site ko browser/Chrome mein open karke sign-in karo.'));
      setTimeout(check,100);
    };
    check();
  });
}

    headers:{Authorization:'Bearer '+accessToken}
  });
  const data=await res.json();
  if(!res.ok) throw new Error(data.error?.message||'YouTube API error');
  return data;
}

async function connectMyLive(){
  try{
    document.getElementById('liveStatus').textContent='● Finding your live...';
    const data=await ytApi('liveBroadcasts?part=snippet,status&mine=true');
    // Scheduled/upcoming broadcasts can also have a liveChatId. Only accept a
    // broadcast that YouTube explicitly reports as currently live.
    const live=(data.items||[]).find(item => item?.status?.lifeCycleStatus === 'live');
    const chatId=live?.snippet?.liveChatId;
    if(!live || !chatId) throw new Error('NO LIVE STREAM FOUND — aap abhi live nahi ho. Live start karne ke baad dobara CONNECT MY YOUTUBE dabao.');
    document.getElementById('liveChatId').value=chatId;
    document.getElementById('liveStatus').textContent='● LIVE FOUND — reading comments';
    lastSeen.clear();
    pollYouTubeOAuth();
    clearInterval(pollTimer);
    pollTimer=setInterval(pollYouTubeOAuth,5000);
  }catch(e){
    document.getElementById('liveStatus').textContent='● '+e.message;
  }
}

async function pollYouTubeOAuth(){
  const chatId=document.getElementById('liveChatId').value.trim();
  if(!accessToken||!chatId) return;
  try{
    const data=await ytApi('liveChat/messages?part=snippet,authorDetails&liveChatId='+encodeURIComponent(chatId)+'&maxResults=20');
    const items=(data.items||[]).reverse();
    for(const item of items){
      if(lastSeen.has(item.id)) continue;
      lastSeen.add(item.id);
      const name=item.authorDetails?.displayName;
      const message=item.snippet?.displayMessage||'';
      if(name) showIncomingName(name,message);
    }
  }catch(e){
    document.getElementById('liveStatus').textContent='● '+e.message;
  }
}

const clientIdInput=document.getElementById('clientId');
const savedClientId=localStorage.getItem('aai_youtube_client_id');
if(savedClientId) clientIdInput.value=savedClientId;
clientIdInput.addEventListener('change',()=>localStorage.setItem('aai_youtube_client_id',clientIdInput.value.trim()));

document.getElementById('signInBtn').onclick=async()=>{
  const clientId=document.getElementById('clientId').value.trim();
  if(!clientId){ alert('Pehle OAuth Client ID paste karo.'); return; }
  localStorage.setItem('aai_youtube_client_id',clientId);

  // A local Android WebView/file:// page is not a valid Google OAuth origin.
  if(location.protocol === 'file:'){
    const secureSite='https://eloquent-chaja-bfc14d.netlify.app/';
    document.getElementById('liveStatus').textContent='● Opening secure HTTPS page for Google Sign-In...';
    location.href=secureSite;
    return;
  }

  document.getElementById('liveStatus').textContent='● Loading Google Sign-In...';
  try{
    await waitForGoogleSignIn();
  }catch(e){
    document.getElementById('liveStatus').textContent='● '+e.message;
    alert(e.message);
    return;
  }

  const tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:clientId,
    scope:YT_SCOPE,
    callback:(resp)=>{
      if(resp.error){
        document.getElementById('liveStatus').textContent='● Sign-in error: '+(resp.error_description||resp.error);
        return;
      }
      accessToken=resp.access_token;
      connectMyLive();
    }
  });
  tokenClient.requestAccessToken({prompt:'consent'});
};
</script>
