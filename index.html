<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AAI VLOGS</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111318;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    /* HERO */
    .hero {
      border-radius: 25px;
      overflow: hidden;
      background: #1c1f26;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    .hero img {
      width: 100%;
      display: block;
      min-height: 250px;
      object-fit: cover;
    }

    .logo-area {
      padding: 25px;
      text-align: center;
    }

    .logo-area h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .logo-area p {
      color: #aaa;
    }

    /* INPUT BOX */
    .input-box {
      background: #20232b;
      padding: 28px;
      border-radius: 25px;
      margin-bottom: 22px;
    }

    textarea {
      width: 100%;
      height: 110px;
      border: none;
      border-radius: 18px;
      padding: 18px;
      font-size: 20px;
      resize: none;
      outline: none;
      color: #222;
      background: #fff;
    }

    .buttons {
      display: flex;
      gap: 18px;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 18px 25px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:active {
      transform: scale(.97);
    }

    .write-btn {
      flex: 1;
      background: #e9144f;
      color: white;
    }

    .clear-btn {
      background: #44464e;
      color: white;
      min-width: 150px;
    }

    /* CARDS */
    .card {
      background: #20232b;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .google-btn {
      width: 100%;
      background: white;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .youtube-btn {
      width: 100%;
      background: #ff0000;
      color: white;
      margin-top: 12px;
    }

    .status {
      text-align: center;
      padding: 20px;
      color: #aee8bf;
      font-size: 20px;
    }

    .result {
      margin-top: 18px;
      padding: 15px;
      background: #17191f;
      border-radius: 12px;
      display: none;
      line-height: 1.6;
    }

    .user-info {
      display: none;
      text-align: center;
      padding: 15px;
      color: #aee8bf;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .buttons {
        gap: 10px;
      }

      button {
        padding: 16px 12px;
        font-size: 16px;
      }

      .clear-btn {
        min-width: 110px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="hero">
      <!-- Agar image upload ki hai to yahan image ka naam lagana -->
      <!-- Example: <img src="banner.jpg"> -->

      <div class="logo-area">
        <h1>▶️ AAI VLOGS</h1>
        <p>Welcome to AAI VLOGS ❤️</p>
      </div>
    </div>


    <!-- NAME WRITER -->
    <div class="input-box">
      <textarea
        id="nameInput"
        placeholder="Yahan apna naam likho... ✍️"
      ></textarea>

      <div class="buttons">
        <button class="write-btn" onclick="writeName()">
          ✍️ NAAM LIKHO
        </button>

        <button class="clear-btn" onclick="clearName()">
          CLEAR
        </button>
      </div>

      <div class="result" id="result"></div>
    </div>


    <!-- GOOGLE SIGN IN -->
    <div class="card">
      <h2>▶ 🔐 Google / YouTube Sign-In</h2>

      <button class="google-btn" onclick="signInWithGoogle()">
        🔵 Sign in with Google
      </button>

      <button class="youtube-btn" onclick="youtubeSignIn()">
        ▶ Continue with YouTube
      </button>

      <div class="user-info" id="userInfo"></div>
    </div>


    <!-- YOUTUBE SETTINGS -->
    <div class="card">
      <h2>▶ ⚙️ YouTube Live Settings</h2>
      <p style="color:#aaa; line-height:1.6;">
        Google sign-in complete hone ke baad YouTube features configure kiye ja sakte hain.
      </p>
    </div>


    <div class="status">
      🟢 Ready
    </div>

  </div>


  <script>

    // ==========================================
    // TUMHARA GOOGLE OAUTH CLIENT ID
    // ==========================================
    const CLIENT_ID =
      "494856570853-l883v2hl9fnkq87skmipaj80fce8ve55.apps.googleusercontent.com";


    // Naam likhne wala function
    function writeName() {
      const name = document.getElementById("nameInput").value.trim();
      const result = document.getElementById("result");

      if (name === "") {
        result.style.display = "block";
        result.innerHTML = "⚠️ Bhai pehle apna naam likho!";
        return;
      }

      result.style.display = "block";
      result.innerHTML =
        "❤️ Thank You So Much, <b>" + escapeHtml(name) + "</b>!<br>Love You All ❤️";
    }


    // Clear button
    function clearName() {
      document.getElementById("nameInput").value = "";
      document.getElementById("result").style.display = "none";
    }


    // Safe text display
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }


    // Google Sign-In
    function signInWithGoogle() {

      if (!window.google || !google.accounts) {
        alert("Google Sign-In abhi load ho raha hai. 2 second baad try karo.");
        return;
      }

      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,

        // Basic Google profile access
        scope: "openid email profile",

        callback: function(response) {

          if (response.error) {
            console.error(response);
            alert("Sign-in error: " + response.error);
            return;
          }

          document.getElementById("userInfo").style.display = "block";
          document.getElementById("userInfo").innerHTML =
            "✅ Google Sign-In Successful!<br>Welcome to AAI VLOGS ❤️";
        }
      });

      client.requestAccessToken();
    }


    // YouTube Sign-In with YouTube permission
    function youtubeSignIn() {

      if (!window.google || !google.accounts) {
        alert("Google service load ho raha hai, thoda wait karo.");
        return;
      }

      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,

        scope: "https://www.googleapis.com/auth/youtube.readonly",

        callback: function(response) {

          if (response.error) {
            console.error(response);
            alert("YouTube Sign-In error: " + response.error);
            return;
          }

          document.getElementById("userInfo").style.display = "block";
          document.getElementById("userInfo").innerHTML =
            "🎉 YouTube connected successfully! ❤️";
        }
      });

      client.requestAccessToken();
    }

  </script>

</body>
</html>
